<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cozy AI - เพื่อนคู่ใจ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Prompt', sans-serif; background-color: #FAF7F2; color: #3E362E; }
    .cozy-shadow { box-shadow: 0 10px 25px -5px rgba(139, 108, 80, 0.12); }
    .modal-backdrop { background-color: rgba(62, 54, 46, 0.45); backdrop-filter: blur(4px); }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: #D8C7B6; border-radius: 9999px; }
  </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

  <!-- Header -->
  <header class="bg-white/80 backdrop-blur-md border-b border-[#EDE3D6] px-4 py-3 flex items-center justify-between z-10">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-[#E09F67] to-[#F3C59B] flex items-center justify-center text-white font-semibold text-lg shadow-sm">
        C
      </div>
      <div>
        <h1 class="font-semibold text-base text-[#3E362E] leading-tight">พี่โคซี่ (Cozy AI)</h1>
        <p class="text-xs text-[#8C7A6B]" id="headerGreeting">พร้อมรับฟังเสมอ</p>
      </div>
    </div>

    <!-- Top-Right Profile Avatar Button -->
    <button onclick="openAccountModal()" title="การตั้งค่าบัญชี" class="relative group focus:outline-none">
      <div id="topAvatarContainer" class="w-10 h-10 rounded-full border-2 border-[#E09F67] overflow-hidden bg-[#F5EBE0] flex items-center justify-center text-[#8B5E34] font-semibold text-sm shadow-sm transition-transform group-hover:scale-105">
        <img id="topAvatarImg" src="" alt="Profile" class="w-full h-full object-cover hidden" />
        <span id="topAvatarInitial">U</span>
      </div>
      <span class="absolute bottom-0 right-0 w-3 h-3 bg-emerald-500 border-2 border-white rounded-full"></span>
    </button>
  </header>

  <!-- Chat Area -->
  <main id="chatContainer" class="flex-1 overflow-y-auto p-4 space-y-4 max-w-3xl w-full mx-auto">
    <!-- Messages injected via JS -->
  </main>

  <!-- Input Bar -->
  <footer class="bg-white border-t border-[#EDE3D6] p-3">
    <form onsubmit="handleSendMessage(event)" class="max-w-3xl mx-auto flex items-center gap-2">
      <input
        type="text"
        id="chatInput"
        placeholder="พิมพ์คุยกับพี่โคซี่ได้เลย..."
        class="flex-1 bg-[#FAF7F2] border border-[#E5D7C6] rounded-full px-4 py-2.5 text-sm focus:outline-none focus:border-[#D48C50]"
        autocomplete="off"
      />
      <button type="submit" class="bg-[#D48C50] hover:bg-[#C07A40] text-white rounded-full px-5 py-2.5 text-sm font-medium transition shadow-sm">
        ส่ง
      </button>
    </form>
  </footer>

  <!-- 1. Welcome Nickname Modal (Opens on first launch) -->
  <div id="nicknameModal" class="fixed inset-0 modal-backdrop hidden items-center justify-center z-50 p-4">
    <div class="bg-white rounded-3xl max-w-sm w-full p-6 cozy-shadow border border-[#EDE3D6] text-center space-y-4 animate-fade-in">
      <div class="w-16 h-16 mx-auto rounded-full bg-[#FDF2E6] flex items-center justify-center text-2xl font-bold text-[#8B5E34]">
        ID
      </div>
      <div>
        <h2 class="text-lg font-semibold text-[#3E362E]">สวัสดี ยินดีต้อนรับ</h2>
        <p class="text-sm text-[#7A6A5C] mt-1">อยากให้พี่โคซี่เรียกว่าอะไร (ชื่อเล่น)</p>
      </div>
      <input
        type="text"
        id="nicknameInput"
        placeholder="กรอกชื่อเล่นของคุณ..."
        class="w-full bg-[#FAF7F2] border border-[#E5D7C6] rounded-xl px-4 py-2.5 text-center text-sm focus:outline-none focus:border-[#D48C50]"
      />
      <button onclick="saveNickname()" class="w-full bg-[#D48C50] hover:bg-[#C07A40] text-white font-medium py-2.5 rounded-xl text-sm transition shadow-sm">
        บันทึกชื่อเล่น
      </button>
    </div>
  </div>

  <!-- 2. Account & Settings Modal (Opens when clicking top-right avatar) -->
  <div id="accountModal" class="fixed inset-0 modal-backdrop hidden items-end sm:items-center justify-center z-50 p-0 sm:p-4">
    <div class="bg-white rounded-t-3xl sm:rounded-3xl max-w-md w-full max-h-[90vh] overflow-y-auto cozy-shadow border border-[#EDE3D6]">
      <!-- Modal Header -->
      <div class="sticky top-0 bg-white/95 backdrop-blur px-6 py-4 border-b border-[#EDE3D6] flex items-center justify-between">
        <h3 class="font-semibold text-base text-[#3E362E]">บัญชีและการตั้งค่า</h3>
        <button onclick="closeAccountModal()" class="w-8 h-8 rounded-full bg-[#FAF7F2] hover:bg-[#EFE6DA] flex items-center justify-center text-[#7A6A5C]">✕</button>
      </div>

      <div class="p-6 space-y-6">
        <!-- Profile Picture & Nickname Section -->
        <div class="flex flex-col items-center text-center space-y-3">
          <div class="relative">
            <div class="w-20 h-20 rounded-full border-2 border-[#E09F67] overflow-hidden bg-[#F5EBE0] flex items-center justify-center text-[#8B5E34] font-semibold text-2xl">
              <img id="modalAvatarImg" src="" alt="Profile" class="w-full h-full object-cover hidden" />
              <span id="modalAvatarInitial">U</span>
            </div>
            <label for="avatarUpload" class="absolute bottom-0 right-0 bg-[#D48C50] hover:bg-[#C07A40] text-white w-7 h-7 rounded-full flex items-center justify-center cursor-pointer shadow text-xs" title="เปลี่ยนรูปโปรไฟล์">
              +
            </label>
            <input type="file" id="avatarUpload" accept="image/*" class="hidden" onchange="handleAvatarUpload(event)" />
          </div>

          <div class="w-full max-w-xs">
            <label class="block text-xs text-[#8C7A6B] mb-1">ชื่อเล่นที่พี่โคซี่เรียก</label>
            <div class="flex gap-2">
              <input type="text" id="settingsNicknameInput" class="flex-1 bg-[#FAF7F2] border border-[#E5D7C6] rounded-lg px-3 py-1.5 text-sm text-center focus:outline-none focus:border-[#D48C50]" />
              <button onclick="updateNicknameFromSettings()" class="bg-[#EFE6DA] hover:bg-[#E2D3C0] text-[#5C4B3B] px-3 py-1.5 rounded-lg text-xs font-medium">บันทึก</button>
            </div>
          </div>
        </div>

        <!-- Menu Accordion Items -->
        <div class="space-y-2.5">
          <!-- 1. ดูเมลที่ล็อกอิน -->
          <div class="border border-[#EDE3D6] rounded-2xl overflow-hidden">
            <button onclick="toggleSection('secEmail')" class="w-full px-4 py-3 bg-[#FAF7F2] hover:bg-[#F4ECE1] flex items-center justify-between text-left">
              <span class="text-sm font-medium flex items-center gap-2.5">อีเมลที่ล็อกอิน</span>
              <span class="text-xs text-[#8C7A6B]">v</span>
            </button>
            <div id="secEmail" class="hidden p-4 bg-white border-t border-[#EDE3D6] space-y-2 text-sm">
              <div class="flex justify-between items-center">
                <span class="text-[#8C7A6B]">บัญชีปัจจุบัน:</span>
                <span id="displayEmail" class="font-medium text-[#3E362E]">cozy.user@example.com</span>
              </div>
              <div class="flex justify-between items-center">
                <span class="text-[#8C7A6B]">สถานะ:</span>
                <span class="text-xs bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded-full font-medium">ยืนยันอีเมลแล้ว</span>
              </div>
              <div class="pt-2">
                <input type="email" id="changeEmailInput" placeholder="เปลี่ยนอีเมลใหม่..." class="w-full bg-[#FAF7F2] border border-[#E5D7C6] rounded-lg px-3 py-1.5 text-xs mb-2" />
                <button onclick="updateEmail()" class="w-full bg-[#EFE6DA] hover:bg-[#E2D3C0] text-[#5C4B3B] py-1.5 rounded-lg text-xs font-medium">อัปเดตอีเมล</button>
              </div>
            </div>
          </div>

          <!-- 2. อุปกรณ์ที่เข้าสู่ระบบ -->
          <div class="border border-[#EDE3D6] rounded-2xl overflow-hidden">
            <button onclick="toggleSection('secDevices')" class="w-full px-4 py-3 bg-[#FAF7F2] hover:bg-[#F4ECE1] flex items-center justify-between text-left">
              <span class="text-sm font-medium flex items-center gap-2.5">อุปกรณ์ที่เข้าสู่ระบบ</span>
              <span class="text-xs text-[#8C7A6B]">v</span>
            </button>
            <div id="secDevices" class="hidden p-4 bg-white border-t border-[#EDE3D6] space-y-3 text-xs">
              <div id="deviceList" class="space-y-2.5"></div>
            </div>
          </div>

          <!-- 3. รหัสผ่านและความปลอดภัย -->
          <div class="border border-[#EDE3D6] rounded-2xl overflow-hidden">
            <button onclick="toggleSection('secSecurity')" class="w-full px-4 py-3 bg-[#FAF7F2] hover:bg-[#F4ECE1] flex items-center justify-between text-left">
              <span class="text-sm font-medium flex items-center gap-2.5">รหัสผ่านและความปลอดภัย</span>
              <span class="text-xs text-[#8C7A6B]">v</span>
            </button>
            <div id="secSecurity" class="hidden p-4 bg-white border-t border-[#EDE3D6] space-y-3 text-xs">
              <div class="space-y-2">
                <label class="block text-[#7A6A5C] font-medium">เปลี่ยนรหัสผ่านใหม่</label>
                <input type="password" id="newPasswordInput" placeholder="รหัสผ่านใหม่ (อย่างน้อย 6 ตัวอักษร)" class="w-full bg-[#FAF7F2] border border-[#E5D7C6] rounded-lg px-3 py-2" />
                <button onclick="changePassword()" class="w-full bg-[#D48C50] hover:bg-[#C07A40] text-white py-2 rounded-lg font-medium">บันทึกรหัสผ่านใหม่</button>
              </div>
              <div class="pt-2 border-t border-[#EDE3D6] flex items-center justify-between">
                <span class="text-[#7A6A5C]">ลืมรหัสผ่านเดิม?</span>
                <button onclick="sendPasswordReset()" class="text-[#D48C50] hover:underline font-medium">ส่งลิงก์รีเซ็ตทางอีเมล</button>
              </div>
              <p id="securityFeedback" class="text-emerald-600 hidden"></p>
            </div>
          </div>

          <!-- 4. โปรแกรมสมาชิก -->
          <div class="border border-[#EDE3D6] rounded-2xl overflow-hidden">
            <button onclick="toggleSection('secMembership')" class="w-full px-4 py-3 bg-[#FAF7F2] hover:bg-[#F4ECE1] flex items-center justify-between text-left">
              <span class="text-sm font-medium flex items-center gap-2.5">โปรแกรมสมาชิก</span>
              <span id="memberBadge" class="text-xs bg-[#FDF2E6] text-[#C07A40] px-2 py-0.5 rounded-full font-medium">Free Plan</span>
            </button>
            <div id="secMembership" class="hidden p-4 bg-white border-t border-[#EDE3D6] space-y-3 text-xs">
              <div class="p-3 rounded-xl bg-gradient-to-r from-[#FDF2E6] to-[#FAF0E4] border border-[#F0D9C0]">
                <div class="font-semibold text-sm text-[#8B5E34]" id="planTitle">Cozy Basic (ใช้งานฟรี)</div>
                <p class="text-[#7A6A5C] mt-1" id="planDesc">พูดคุยกับพี่โคซี่ได้ไม่จำกัด พร้อมบันทึกความทรงจำพื้นฐาน</p>
              </div>
              <button onclick="toggleMembershipPlan()" id="upgradeBtn" class="w-full bg-[#3E362E] hover:bg-[#2A241E] text-white py-2 rounded-lg font-medium transition">
                อัปเกรดเป็น Cozy Plus
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // State Management with LocalStorage
    const state = {
      nickname: localStorage.getItem('cozy_nickname') || '',
      avatar: localStorage.getItem('cozy_avatar') || '',
      email: localStorage.getItem('cozy_email') || 'member@cozyai.app',
      isPlus: localStorage.getItem('cozy_isPlus') === 'true',
      devices: JSON.parse(localStorage.getItem('cozy_devices')) || [
        { id: 1, name: navigator.platform || 'อุปกรณ์ปัจจุบัน (Web Browser)', location: 'Bangkok, Thailand', current: true, lastActive: 'ใช้งานอยู่ตอนนี้' },
        { id: 2, name: 'iPhone - Safari Mobile', location: 'Bangkok, Thailand', current: false, lastActive: '2 ชั่วโมงที่แล้ว' }
      ]
    };

    // Initialize App
    window.addEventListener('DOMContentLoaded', () => {
      syncUI();
      if (!state.nickname) {
        openNicknameModal();
      } else {
        addCozyMessage(`สวัสดี ${state.nickname} วันนี้เป็นยังไงบ้าง มีเรื่องอะไรอยากเล่าให้พี่โคซี่ฟังไหม?`);
      }
    });

    function syncUI() {
      // Update Header Greeting
      const greetingEl = document.getElementById('headerGreeting');
      greetingEl.textContent = state.nickname ? `กำลังคุยกับ ${state.nickname}` : 'พร้อมรับฟังเสมอ';

      // Update Avatars (Top right & Modal)
      const initial = (state.nickname || state.email || 'U').charAt(0).toUpperCase();
      document.getElementById('topAvatarInitial').textContent = initial;
      document.getElementById('modalAvatarInitial').textContent = initial;

      const topImg = document.getElementById('topAvatarImg');
      const modalImg = document.getElementById('modalAvatarImg');
      if (state.avatar) {
        topImg.src = state.avatar;
        topImg.classList.remove('hidden');
        document.getElementById('topAvatarInitial').classList.add('hidden');

        modalImg.src = state.avatar;
        modalImg.classList.remove('hidden');
        document.getElementById('modalAvatarInitial').classList.add('hidden');
      } else {
        topImg.classList.add('hidden');
        document.getElementById('topAvatarInitial').classList.remove('hidden');
        modalImg.classList.add('hidden');
        document.getElementById('modalAvatarInitial').classList.remove('hidden');
      }

      // Sync Settings Inputs
      document.getElementById('settingsNicknameInput').value = state.nickname;
      document.getElementById('displayEmail').textContent = state.email;

      // Sync Membership
      document.getElementById('memberBadge').textContent = state.isPlus ? 'Cozy Plus' : 'Free Plan';
      document.getElementById('planTitle').textContent = state.isPlus ? 'Cozy Plus (สมาชิกพิเศษ)' : 'Cozy Basic (ใช้งานฟรี)';
      document.getElementById('planDesc').textContent = state.isPlus
        ? 'ปลดล็อกโหมดเพื่อนสนิท ธีมพิเศษ และความจำระยะยาวเต็มรูปแบบแล้ว'
        : 'พูดคุยกับพี่โคซี่ได้ไม่จำกัด พร้อมบันทึกความทรงจำพื้นฐาน';
      document.getElementById('upgradeBtn').textContent = state.isPlus ? 'เปลี่ยนกลับเป็นแพ็กเกจฟรี' : 'อัปเกรดเป็น Cozy Plus';

      renderDevices();
    }

    // Nickname Modal Functions
    function openNicknameModal() {
      const modal = document.getElementById('nicknameModal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      setTimeout(() => document.getElementById('nicknameInput').focus(), 100);
    }

    function saveNickname() {
      const input = document.getElementById('nicknameInput').value.trim();
      state.nickname = input || 'คนเก่ง';
      localStorage.setItem('cozy_nickname', state.nickname);

      const modal = document.getElementById('nicknameModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');

      syncUI();
      addCozyMessage(`ยินดีที่ได้รู้จักนะ "${state.nickname}" ต่อจากนี้พี่โคซี่จะเรียกชื่อนี้เสมอนะ มีอะไรให้พี่ช่วยหรืออยากระบายเรื่องไหน พิมพ์มาได้เลย`);
    }

    function updateNicknameFromSettings() {
      const newName = document.getElementById('settingsNicknameInput').value.trim();
      if (!newName) return;
      state.nickname = newName;
      localStorage.setItem('cozy_nickname', state.nickname);
      syncUI();
      addCozyMessage(`รับทราบ เปลี่ยนมาเรียกว่า "${state.nickname}" เรียบร้อยแล้ว`);
    }

    // Account Modal & Profile Picture
    function openAccountModal() {
      syncUI();
      const modal = document.getElementById('accountModal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeAccountModal() {
      const modal = document.getElementById('accountModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function handleAvatarUpload(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        state.avatar = e.target.result;
        localStorage.setItem('cozy_avatar', state.avatar);
        syncUI();
      };
      reader.readAsDataURL(file);
    }

    // Settings Accordion
    function toggleSection(id) {
      const el = document.getElementById(id);
      el.classList.toggle('hidden');
    }

    function updateEmail() {
      const val = document.getElementById('changeEmailInput').value.trim();
      if (!val || !val.includes('@')) return alert('กรุณากรอกรูปแบบอีเมลให้ถูกต้องครับ');
      state.email = val;
      localStorage.setItem('cozy_email', state.email);
      document.getElementById('changeEmailInput').value = '';
      syncUI();
    }

    function renderDevices() {
      const container = document.getElementById('deviceList');
      container.innerHTML = state.devices.map(d => `
        <div class="flex items-center justify-between p-2.5 rounded-xl bg-[#FAF7F2] border border-[#EDE3D6]">
          <div>
            <div class="font-medium text-[#3E362E]">${d.name} ${d.current ? '<span class="text-[10px] text-emerald-600 font-semibold">(เครื่องนี้)</span>' : ''}</div>
            <div class="text-[11px] text-[#8C7A6B]">${d.location} - ${d.lastActive}</div>
          </div>
          ${!d.current ? `<button onclick="removeDevice(${d.id})" class="text-rose-500 hover:underline font-medium">ออกจากระบบ</button>` : ''}
        </div>
      `).join('');
    }

    function removeDevice(id) {
      state.devices = state.devices.filter(d => d.id !== id);
      localStorage.setItem('cozy_devices', JSON.stringify(state.devices));
      renderDevices();
    }

    function changePassword() {
      const pw = document.getElementById('newPasswordInput').value;
      const fb = document.getElementById('securityFeedback');
      if (pw.length < 6) {
        fb.textContent = 'รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษรครับ';
        fb.className = 'text-rose-500 block';
        return;
      }
      document.getElementById('newPasswordInput').value = '';
      fb.textContent = 'เปลี่ยนรหัสผ่านใหม่เรียบร้อยแล้ว';
      fb.className = 'text-emerald-600 block';
    }

    function sendPasswordReset() {
      const fb = document.getElementById('securityFeedback');
      fb.textContent = `ส่งลิงก์รีเซ็ตรหัสผ่านไปที่ ${state.email} เรียบร้อยแล้ว`;
      fb.className = 'text-emerald-600 block';
    }

    function toggleMembershipPlan() {
      state.isPlus = !state.isPlus;
      localStorage.setItem('cozy_isPlus', state.isPlus);
      syncUI();
    }

    // Simple Chat Interaction
    function addCozyMessage(text) {
      const chat = document.getElementById('chatContainer');
      const div = document.createElement('div');
      div.className = 'flex items-start gap-2.5';
      div.innerHTML = `
        <div class="w-8 h-8 rounded-full bg-[#E09F67] text-white flex items-center justify-center text-sm shrink-0 mt-1">C</div>
        <div class="bg-white border border-[#EDE3D6] rounded-2xl rounded-tl-none px-4 py-2.5 text-sm text-[#3E362E] shadow-sm max-w-[80%]">
          ${text}
        </div>
      `;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function addUserMessage(text) {
      const chat = document.getElementById('chatContainer');
      const div = document.createElement('div');
      div.className = 'flex items-start justify-end gap-2.5';
      div.innerHTML = `
        <div class="bg-[#D48C50] text-white rounded-2xl rounded-tr-none px-4 py-2.5 text-sm shadow-sm max-w-[80%]">
          ${text}
        </div>
      `;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function handleSendMessage(e) {
      e.preventDefault();
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      if (!text) return;

      addUserMessage(text);
      input.value = '';

      setTimeout(() => {
        const name = state.nickname || 'เธอ';
        addCozyMessage(`พี่โคซี่รับฟังอยู่นะ ${name} เรื่อง "${text}" ที่เล่ามา พี่เป็นกำลังใจให้เสมอนะ`);
      }, 600);
    }
  </script>
</body>
</html>
